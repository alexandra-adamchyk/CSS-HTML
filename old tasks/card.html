<!-- Task: Creating an Interactive Product Card
Objective: Practice combining semantic tags, lists, images, text formatting, and simple form elements in HTML.

Task Requirements:
Create an HTML page with a product card for an online store (e.g., a smartphone, sneakers, or a book).

Title: Add the product name using the <h2> tag.*

Image: Insert a product photo (<img>) with properly filled src and alt attributes.*

Specifications: Create a short bulleted list (<ul>) with 3–4 specifications (e.g., color, size, material, warranty).*

Price: Highlight the current price using the <strong> tag. If there is a discount, display the old price using the <del> tag.

Interactive Elements:

Add a numeric input field (<input type="number">) for selecting the quantity with min="1", max="5", and an initial value="1".

Add a "Buy" button (<button>).*

Link: At the bottom of the card, add a link (<a>) pointing to the manufacturer's website that opens in a new tab (target="_blank").* -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <div>
        <h2>Product name</h2>
        <img src="img/inthesky-iphone-6-658844_1920.jpg" alt="iphone-image" height="100" width="200">
        <ul>
            <li>spec1</li>
            <li>spec1</li>
            <li>spec1</li>
            <li>spec1</li>
        </ul>
        <p>Price:<strong> 45 </strong><del> 90 </del></p>
        <form action="#">
        <label for="quantity">Items:</label>
        <input type="number" value="1" min="1" max="5" required id="quantity" name="quantity">
        <button type="submit">Buy</button>
        </form>
        <a href="www.iphone.com/587547" target="_blank">Iphone 18</a>
    </div>
</body>
</html>
